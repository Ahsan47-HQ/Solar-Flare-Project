services:
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      HELION_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      OMP_NUM_THREADS: "2"
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      PORT: "80"
      HELION_API_BASE: http://localhost:8000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
